name: relay-ci

# The relay owns the wire protocol, so this gate protects the controller and
# Unity clients as much as the relay itself: a protocol edit that forgets to
# regenerate the shared schema fails here instead of surfacing as a silent
# pairing bug on demo day.
on:
  push:
    branches: [main, dev]
    paths:
      - "relay/**"
      - "shared/protocol/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay/**"
      - "shared/protocol/**"
      - ".github/workflows/relay-ci.yml"

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Protocol schema is in sync with protocol.ts
        run: npm run schema:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
